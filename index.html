<html lang="fr">

<meta name="description" content="Le jeu de cartes à collectionner des licenciés du Handball Lunel Marsillargues.">

<meta name="robots" content="noindex">

<meta name="mobile-web-app-capable" content="yes">

<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout : appli plein écran, en-tête compteur + vue + barre d'onglets fixe en bas (style carton de match : papier, encre, lignes de terrain) */
:root {
  --bg: #ECE8DA; --panel: #F7F4EA; --ink: #23221F; --muted: #5D594F; --line: #CFC8B4; --accent: #6B3A8C; --accent-ink: #FFFFFF;
  --good: #2F7A3E; --warn: #9A5B12; --sea: #2F6DB5;
  --card-paper: #F3F0E4; --card-art: #F7F4EA; --card-ink: #23221F; --card-muted: #5D594F; --card-rule: #C9C3B1; --card-bar: #FBF9F2; --card-fill: #3A3833; --card-limit: #7A3E9D; --card-sil: #F7F1E3;
  --r-com: #8D9198; --r-com-ink: #4A4F57; --r-pc: #3E8E4E; --r-pc-ink: #276633; --r-rare: #2F6DB5; --r-rare-ink: #245A99; --r-epi: #7B4CB0; --r-epi-ink: #5B3590; --r-leg: #B8862A; --r-leg-ink: #7A520C; --r-leg-pill: #F1D58C;
  --t-ville: #F1E3DC; --t-ville-l: #C08A7A; --t-ville-i: #8A3A2F; --t-mer: #D6E8F1; --t-mer-l: #5B92BF; --t-mer-i: #1F4E79; --t-mont: #EFE6D6; --t-mont-l: #B9824A; --t-mont-i: #6B421C; --t-camp: #E6EED2; --t-camp-l: #9DB27A; --t-camp-i: #3D6330;
  --f-display: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --f-body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1B1A17; --panel: #26241F; --ink: #EDE8DA; --muted: #ABA493; --line: #403C33; --accent: #B88BD8; --accent-ink: #1B1A17; --good: #7CC48A; --warn: #E0A35A; --sea: #7FB0E6; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #1B1A17; --panel: #26241F; --ink: #EDE8DA; --muted: #ABA493; --line: #403C33; --accent: #B88BD8; --accent-ink: #1B1A17; --good: #7CC48A; --warn: #E0A35A; --sea: #7FB0E6; color-scheme: dark }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; margin: 0; overflow: hidden; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button { font: inherit; color: inherit; }
.app { height: 100%; display: flex; flex-direction: column; }
.top { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); background: var(--bg); }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 19px; white-space: nowrap; min-width: 0; letter-spacing: .06em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
.brand svg { flex: none; }
.wallet { display: flex; gap: 10px; font-family: var(--f-display); font-weight: 600; font-size: 15px; font-variant-numeric: tabular-nums; }
.wallet span { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); }
main { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding-block: 16px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.view { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
nav.tabs { flex: none; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: 1px solid var(--line); background: var(--panel); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
nav.tabs button { background: none; border: 0; padding: 8px 4px 9px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-family: var(--f-display); font-weight: 600; font-size: 12px; letter-spacing: .02em; text-transform: uppercase; color: var(--muted); cursor: pointer; min-height: 52px; position: relative; min-width: 0; white-space: nowrap; }
@media (max-width: 360px) { nav.tabs button { font-size: 10.5px; letter-spacing: 0; } }
nav.tabs button[aria-selected="true"] { color: var(--ink); }
nav.tabs button[aria-selected="true"]::before { content: ""; position: absolute; top: -1px; left: 22%; right: 22%; height: 3px; background: var(--accent); border-radius: 0 0 3px 3px; }
nav.tabs .dot { position: absolute; top: 6px; right: calc(50% - 20px); min-width: 16px; height: 16px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font-size: 11px; line-height: 16px; letter-spacing: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

h2 { font-family: var(--f-display); font-weight: 700; font-size: 26px; letter-spacing: .02em; text-transform: uppercase; margin: 0; text-wrap: balance; line-height: 1.05; }
h3 { font-family: var(--f-display); font-weight: 700; font-size: 17px; letter-spacing: .08em; text-transform: uppercase; margin: 0; color: var(--muted); }
p { margin: 0; line-height: 1.45; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 18px; border-radius: 10px; border: 1.5px solid var(--ink); background: var(--ink); color: var(--bg); font-family: var(--f-display); font-weight: 700; font-size: 17px; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--ink); }
.btn.accent { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.wide { width: 100%; }
.btn.sm { min-height: 38px; font-size: 14px; padding: 0 12px; }
select, input[type="search"] { font: inherit; min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); width: 100%; box-sizing: border-box; }
.loading { padding: 60px 0; text-align: center; color: var(--muted); font-family: var(--f-display); letter-spacing: .1em; text-transform: uppercase; }

/* ---------- Booster ---------- */
.pile { display: flex; justify-content: center; padding: 8px 0 4px; }
.pile .stack { position: relative; width: 168px; height: 236px; }
.pile .stack > div { position: absolute; inset: 0; }
.stockline { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--f-display); }
.stockline b { font-size: 34px; font-weight: 700; }
.gauge { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px; }
.gauge i { height: 8px; border-radius: 2px; background: var(--line); }
.gauge i.on { background: var(--accent); }

/* ---------- Carte ---------- */
.card { --cw: 300px; width: var(--cw); max-width: 100%; aspect-ratio: 5 / 7; font-size: calc(var(--cw) / 30); box-sizing: border-box; padding: .8em; border-radius: 1.4em; background: var(--rc); color: var(--card-ink); font-family: var(--f-body); position: relative; flex: none; }
.card.r0 { --rc: var(--r-com); --rci: var(--r-com-ink); --rpill: var(--r-com-ink); --rpill-ink: #FFFFFF; }
.card.r1 { --rc: var(--r-pc); --rci: var(--r-pc-ink); --rpill: var(--r-pc-ink); --rpill-ink: #FFFFFF; }
.card.r2 { --rc: var(--r-rare); --rci: var(--r-rare-ink); --rpill: var(--r-rare); --rpill-ink: #FFFFFF; }
.card.r3 { --rc: var(--r-epi); --rci: var(--r-epi-ink); --rpill: var(--r-epi); --rpill-ink: #FFFFFF; }
.card.r4 { --rc: repeating-linear-gradient(135deg, var(--r-leg) 0 1.4em, #D8AE52 1.4em 2.2em, var(--r-leg) 2.2em 3.6em); --rci: var(--r-leg-ink); --rpill: var(--r-leg-pill); --rpill-ink: #5A3E05; }
.card .in { height: 100%; box-sizing: border-box; border-radius: .9em; background: var(--card-paper); padding: 1em; display: flex; flex-direction: column; gap: .6em; overflow: hidden; }
.card .hd { display: flex; justify-content: space-between; align-items: center; font-family: var(--f-display); }
.card .no { font-weight: 600; font-size: 1.15em; letter-spacing: .08em; color: var(--card-muted); }
.card .pill { font-weight: 700; font-size: 1.05em; letter-spacing: .1em; padding: .15em .8em; border-radius: 999px; background: var(--rpill); color: var(--rpill-ink); text-transform: uppercase; }
.card .nm { font-family: var(--f-display); font-weight: 700; font-size: 3em; line-height: .98; letter-spacing: .02em; text-transform: uppercase; margin: 0; overflow-wrap: anywhere; }
.card .nm.l { font-size: 2.3em; } .card .nm.xl { font-size: 1.85em; }
.card .sub { display: flex; justify-content: space-between; gap: .6em; font-size: 1.2em; color: var(--card-muted); margin-top: -.25em; }
.card .sub span:last-child { font-family: var(--f-display); white-space: nowrap; }
.card .art { position: relative; border: .15em solid var(--card-ink); background: var(--tb); aspect-ratio: 318 / 178; flex: none; overflow: hidden; }
.card .art > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.card .ttag svg { width: 1.2em; height: 1.2em; flex: none; }
.card .ttag { position: absolute; left: .7em; bottom: .7em; display: flex; align-items: center; gap: .5em; background: var(--card-art); border: 1px solid var(--card-ink); padding: .3em .7em; font-family: var(--f-display); font-weight: 700; font-size: 1.05em; letter-spacing: .1em; text-transform: uppercase; color: var(--ti); }
.card .ttag.it { font-style: italic; }
.card .stats { display: flex; flex-direction: column; gap: .45em; padding: 0 .2em; }
.card .st { display: grid; grid-template-columns: 1.6em 7em minmax(0, 1fr) 2.6em; align-items: center; column-gap: .7em; height: 1.9em; }
.card .st svg { width: 1.6em; height: 1.6em; }
.card .st .lb { font-family: var(--f-display); font-weight: 600; font-size: 1.2em; white-space: nowrap; letter-spacing: .05em; text-transform: uppercase; }
.card .st .bar { height: .8em; border: 1px solid var(--card-ink); background: var(--card-bar); }
.card .st .bar i { display: block; height: 100%; background: var(--card-fill); }
.card .st .v { font-family: var(--f-display); font-weight: 700; font-size: 1.5em; text-align: right; font-variant-numeric: tabular-nums; }
.card .st.best .lb { font-weight: 700; } .card .st.best .bar i { background: var(--rci); } .card .st.best .v { color: var(--rci); }
.card .stats.hashl .st:not(.hl) { opacity: .3; }
.card .st.hl { background: #FFE9A6; outline: .2em solid var(--card-limit); outline-offset: .15em; border-radius: .3em; }
.card .st.hl .lb, .card .st.hl .v { font-weight: 700; color: var(--card-ink); }
.card .st.hl .bar i { background: var(--card-limit); }
.statban { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); }
.statban svg { width: 38px; height: 38px; flex: none; }
.statban .sl { display: flex; flex-direction: column; min-width: 0; }
.statban .sl span { font-family: var(--f-display); font-weight: 600; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; opacity: .85; }
.statban .sl b { font-family: var(--f-display); font-weight: 700; font-size: 30px; line-height: 1; letter-spacing: .06em; text-transform: uppercase; }
.statban .sv { margin-left: auto; display: flex; align-items: baseline; gap: 8px; font-family: var(--f-display); font-variant-numeric: tabular-nums; }
.statban .sv b { font-size: 34px; font-weight: 700; line-height: 1; }
.statban .sv span { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; opacity: .85; }
@keyframes banIn { from { opacity: 0; transform: scale(.92); } }
.statban { animation: banIn .3s cubic-bezier(.2,.8,.2,1) both; }
.card .an { font-style: italic; font-size: 1.2em; line-height: 1.3; color: var(--card-fill); border-top: 1px solid var(--card-rule); padding-top: .55em; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card .ft { margin-top: auto; display: flex; justify-content: space-between; font-family: var(--f-display); font-weight: 600; font-size: 1.1em; letter-spacing: .06em; text-transform: uppercase; color: var(--card-muted); }
.card.ghost { filter: grayscale(1); opacity: .55; }
.t0 { --tb: var(--t-camp); --tl: var(--t-camp-l); --ti: var(--t-camp-i); }
.t1 { --tb: var(--t-mer); --tl: var(--t-mer-l); --ti: var(--t-mer-i); }
.t2 { --tb: var(--t-ville); --tl: var(--t-ville-l); --ti: var(--t-ville-i); }
.t3 { --tb: var(--t-mont); --tl: var(--t-mont-l); --ti: var(--t-mont-i); }
.card .lat { position: absolute; right: .7em; top: .7em; background: var(--card-ink); color: var(--card-paper); padding: .25em .7em; font-family: var(--f-display); font-weight: 700; font-size: 1em; letter-spacing: .12em; text-transform: uppercase; }
.card .art .jer { position: absolute; left: 50%; top: 8%; height: 84%; width: auto; transform: translateX(-42%); filter: drop-shadow(0 .25em .3em rgba(0,0,0,.25)); }
/* Dos de carte */
.back { --cw: 300px; width: var(--cw); max-width: 100%; aspect-ratio: 5 / 7; font-size: calc(var(--cw) / 30); box-sizing: border-box; padding: .8em; border-radius: 1.4em; background: #33312C; position: relative; flex: none; }
.back .in { position: relative; height: 100%; border-radius: .9em; background: var(--tb); overflow: hidden; }
.back svg.topo { position: absolute; inset: 0; width: 100%; height: 100%; }
.back .band { position: absolute; left: 1.4em; right: 1.4em; display: flex; justify-content: center; background: var(--card-paper); border: .15em solid var(--card-ink); padding: .5em 0; font-family: var(--f-display); font-weight: 700; font-size: 1.25em; letter-spacing: .3em; color: var(--card-ink); }
.back .band.t { top: 1.4em; } .back .band.b { bottom: 1.4em; font-size: 1em; letter-spacing: .14em; }
.back .emb { position: absolute; left: 50%; top: 50%; width: 15em; height: 15em; transform: translate(-50%, -50%); border-radius: 50%; background: var(--card-paper); border: .2em solid var(--card-ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .6em; }
.back .emb svg { width: 5em; height: 5em; }
.back .emb b { font-family: var(--f-display); font-weight: 700; font-size: 2.2em; letter-spacing: .12em; color: var(--ti); text-transform: uppercase; }
.back .emb b.it { font-style: italic; }

/* Ouverture */
.overlay { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding-top: max(16px, env(safe-area-inset-top, 0px)); padding-bottom: max(16px, env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); overflow-y: auto; }
.overlay[hidden] { display: none !important; }
.flip { --cw: min(320px, 82vw, calc((100vh - 220px) * 5 / 7)); width: var(--cw); aspect-ratio: 5 / 7; perspective: 1400px; cursor: pointer; border: 0; padding: 0; background: none; }
.flip .fl { position: relative; width: 100%; height: 100%; transition: transform .55s cubic-bezier(.3,.7,.2,1); transform-style: preserve-3d; }
.flip.open .fl { transform: rotateY(180deg); }
.flip .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.flip .face.front { transform: rotateY(180deg); }
.flip .face > div { --cw: 100%; width: 100%; height: 100%; font-size: calc(min(320px, 82vw, calc((100vh - 220px) * 5 / 7)) / 30); }
.flip .fl { transition: transform .55s cubic-bezier(.3,.7,.2,1); }
.flip .front .card { transition: box-shadow .5s .4s ease; }

/* ---------- Animations ---------- */
@keyframes viewIn { from { opacity: 0; transform: translateY(10px); } }
main.enter > .view { animation: viewIn .32s cubic-bezier(.2,.7,.2,1) both; }
@keyframes growX { from { transform: scaleX(0); } }
main.enter .prog i { transform-origin: left; animation: growX .8s .1s cubic-bezier(.2,.7,.2,1) both; }
@keyframes bump { 30% { transform: scale(1.18); } }
.bump { animation: bump .45s ease-out; }
.btn, .tile, .mini, .dep { transition: transform .12s ease, background-color .2s, opacity .2s; }
.btn:not(:disabled):active, .tile:active, .dep:active, .mini:active { transform: scale(.97); }
@keyframes fadeIn { from { opacity: 0; } }
.overlay:not([hidden]) { animation: fadeIn .2s ease-out; }
@keyframes sheetIn { from { opacity: 0; transform: translateY(24px) scale(.96); } }
.sheet { animation: sheetIn .3s cubic-bezier(.2,.7,.2,1) both; }
@keyframes float { 50% { transform: translateY(-6px); } }
.pile .stack > div:last-child { animation: float 4s ease-in-out infinite; }
.pack { border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 16px; color: var(--ink); }
.pack .packin { animation: packShake .9s ease-in-out infinite; filter: drop-shadow(0 18px 22px rgba(0, 0, 0, .28)); }
.pack .packin .back { --cw: min(230px, 58vw); }
@keyframes packShake { 0%, 100% { transform: rotate(0); } 20% { transform: rotate(-3deg) translateY(-5px); } 40% { transform: rotate(3deg); } 60% { transform: rotate(-2deg) translateY(-2px); } 80% { transform: rotate(1.5deg); } }
.pack.torn .packin { animation: packOut .45s cubic-bezier(.5,0,.8,.3) forwards; }
@keyframes packOut { to { transform: scale(1.3) rotate(-4deg); opacity: 0; filter: brightness(2.2); } }
.packlbl { font-family: var(--f-display); font-weight: 700; font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
@keyframes dealIn { from { opacity: 0; transform: translateY(40px) rotate(-6deg) scale(.9); } }
.flip.deal { animation: dealIn .38s cubic-bezier(.2,.8,.2,1) both; }
.flip.rr2.open .front .card { box-shadow: 0 0 22px 4px rgba(47, 109, 181, .6); }
.flip.rr3.open .front .card { box-shadow: 0 0 28px 6px rgba(123, 76, 176, .75); }
.flip.rr4.open .front .card { box-shadow: 0 0 36px 8px rgba(216, 174, 82, .9); }
.card .in { position: relative; }
.card.r4 .in::after { content: ""; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 35%, rgba(255, 255, 255, .6) 50%, transparent 65%); transform: translateX(-130%); pointer-events: none; }
.flip.open .card.r4 .in::after { animation: shine 1.3s .55s ease-in-out; }
@keyframes shine { to { transform: translateX(130%); } }
@keyframes popIn { 0% { transform: scale(.4); opacity: 0; } 70% { transform: scale(1.12); } }
.badge.pop { animation: popIn .4s .35s cubic-bezier(.2,.8,.2,1) both; }
@keyframes tileIn { from { opacity: 0; transform: translateY(14px) scale(.92); } }
.sumgrid .tile { animation: tileIn .35s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--k, 0) * 45ms); }
.duelres .card { animation: dealIn .4s cubic-bezier(.2,.8,.2,1) both; }
.duelres .card + .card { animation-delay: .14s; }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 12px); } }
.toast:not([hidden]) { animation: toastIn .25s cubic-bezier(.2,.8,.2,1); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
.badge { font-family: var(--f-display); font-weight: 700; font-size: 15px; letter-spacing: .12em; text-transform: uppercase; padding: 4px 12px; border-radius: 999px; }
.badge.new { background: var(--good); color: var(--bg); }
.badge.dup { background: var(--line); color: var(--ink); }
.dots { display: flex; gap: 6px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--accent); }
.sumgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; width: min(560px, 100%); }

/* ---------- Collection ---------- */
.prog { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--accent); }
.region { display: flex; flex-direction: column; gap: 2px; }

(() => {

async function makePhoto(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = url; });

    const sw = W / s, sh = H / s, sx = (img.naturalWidth - sw) / 2, sy = (img.naturalHeight - sh) * 0.3;

    let d = cv.toDataURL('image/webp', 0.62); if (!d.startsWith('data:image/webp')) d = cv.toDataURL('image/jpeg', 0.72);

  if (D) {
    if (D.give == null || S.counts[D.give] < 2) D.give = dupList[0] ?? null;
    const nq = norm(D.q || ''); const hits = [];
    if (nq.length >= 2) { for (let i = 0; i < N; i++) if (C.normNames[i].includes(nq)) hits.push(i); hits.sort((a, b) => (!!S.counts[a] - !!S.counts[b]) || C.nom[a].localeCompare(C.nom[b], 'fr')); }
    draft = `<div class="panel"><h3>Nouvelle offre</h3>
      ${dupList.length ? `<label class="small" for="ogive">Je donne (un de mes doublons)</label>
      <select id="ogive">${dupList.map(i => `<option value="${i}" ${D.give === i ? 'selected' : ''}>${esc(C.nom[i])} · ${RAR_NAMES[C.r[i]]} (×${S.counts[i]})</option>`).join('')}</select>` : '<p class="small muted">Tu n’as pas encore de doublon à proposer. Ouvre des boosters !</p>'}
      <label class="small" for="owant">Je veux en échange</label>
      ${D.want != null ? `<div class="row" style="justify-content:space-between"><span>${cardLine(D.want)}</span><button class="btn ghost sm" data-act="clearwant">Changer</button></div>`
        : `<input type="search" id="owant" placeholder="Nom d'un joueur ou d'une joueuse" value="${esc(D.q || '')}" autocomplete="off">
      <div class="results">${hits.slice(0, 12).map(i => `<button class="res" data-act="pickwant" data-i="${i}"><b><span class="chip r${C.r[i]}"></span>${esc(C.nom[i])}</b><span>${esc(C.deps[depOf[i]].c)} · ${S.counts[i] ? 'tu l’as' : 'manquante'}</span></button>`).join('')}</div>`}
      <div class="row"><button class="btn accent" data-act="postoffer" ${D.want != null && D.give != null && D.want !== D.give ? '' : 'disabled'}>Publier l'offre</button><button class="btn ghost" data-act="canceldraft">Annuler</button></div>
      <p class="small muted">Ton doublon est mis de côté pendant l’offre. Tu le récupères si tu la retires.</p>
    </div>`;
  }
  const line = (o, act, who) => `<div class="offer"><div class="sw small">
      <div class="muted">${esc(who)}</div>
      <div>Donne ${cardLine(o.give, o.from_user !== uid && !S.counts[o.give] ? ' <span class="tagnew">manquante</span>' : '')}</div>
      <div>Contre ${cardLine(o.want)}</div></div>${act}</div>`;
  const T = state.tradeTab;
  const doable = others.filter(o => S.counts[o.want] > 1).length;
  let body = '';
  if (!state.offersLoaded) body = '<div class="loading">Chargement…</div>';
  else if (state.offersErr) body = emptyHTML('Échanges indisponibles.', 'Vérifie ta connexion puis touche « Actualiser ».');
  else if (T === 'offres') body = (doable ? `<p class="small" style="padding:8px 0"><b>${doable}</b> offre${doable > 1 ? 's' : ''} que tu peux accepter avec tes doublons.</p>` : '') +
    (others.length ? others.map(o => { const ok = S.counts[o.want] > 1; return line(o, `<button class="btn sm${ok ? ' accent' : ' ghost'}" data-act="accept" data-id="${o.id}" ${ok ? '' : 'disabled'}>${ok ? 'Échanger' : S.counts[o.want] ? 'Pas en double' : 'Tu ne l’as pas'}</button>`, 'Proposé par ' + o.from_pseudo); }).join('')
      : emptyHTML('Aucune offre en attente.', 'Les offres des autres licenciés apparaîtront ici.'));
  else if (T === 'mine') body = mine.length ? mine.map(o => line(o, `<button class="btn ghost sm" data-act="withdraw" data-id="${o.id}">Retirer</button>`, 'Publiée le ' + dateFR(o.created_at))).join('') : emptyHTML('Aucune offre publiée.', 'Touche « + Échanger » pour proposer un de tes doublons.');
  else body = hist.length ? hist.map(o => { const me = o.from_user === uid; const gave = me ? o.give : o.want, got = me ? o.want : o.give;
      return `<div class="offer"><div class="sw small"><div class="muted">Avec ${esc(me ? (o.taker_pseudo || 'un joueur') : o.from_pseudo)} · ${dateFR(o.taken_at)}</div><div>Donné ${cardLine(gave)}</div><div>Reçu ${cardLine(got)}</div></div></div>`; }).join('') : emptyHTML('Pas encore d’échange.', 'Tes échanges conclus seront listés ici.');
  return `<div class="view">
    <div class="head"><div><h2>Échanges</h2><p class="small muted">Un doublon contre la carte qui te manque.</p></div>${D ? '' : `<button class="btn accent sm" data-act="newoffer">+ Échanger</button>`}</div>
    ${draft}
    <div class="tabsub" role="tablist">${[['offres', `Offres · ${others.length}`], ['mine', `Mes offres · ${mine.length}`], ['hist', 'Historique']].map(([k, l]) => `<button role="tab" data-act="ttab" data-v="${k}" aria-selected="${T === k}">${l}</button>`).join('')}</div>
    <section>${body}</section>
    <button class="btn ghost sm" data-act="reloffers" style="align-self:center">Actualiser</button>
  </div>`;
}
function emptyHTML(a, b) { return `<div class="panel center" style="padding:28px 16px;margin-top:12px"><p><b>${a}</b></p><p class="small muted">${b}</p></div>`; }
const postOffer = () => busyRun(async () => {
  const D = state.offerDraft; const sel = $('#ogive'); if (sel) D.give = Number(sel.value);
  if (D.give == null || D.want == null) return;
  await rpc('post_offer', { p_give: D.give, p_want: D.want });
  state.offerDraft = null; state.tradeTab = 'mine'; toast('Offre publiée');
  applyState(await rpc('my_state')); state.offersAt = 0; await loadOffers(true); render();
});
const withdraw = id => busyRun(async () => { const r = await rpc('withdraw_offer', { p_id: id }); toast(`Offre retirée, ${C.nom[r.give]} est revenue dans ta collection`); applyState(await rpc('my_state')); await loadOffers(true); render(); });
const acceptOffer = id => busyRun(async () => {
  try { const r = await rpc('accept_offer', { p_id: id }); toast(`Échange conclu : ${C.nom[r.got]} rejoint ta collection`); }
  finally { applyState(await rpc('my_state')); await loadOffers(true); render(); }
});

// ------------------------------------------------------------------ PROFIL
function bigStats() {
  let own = 0, leg = 0; const depOwn = new Uint16Array(C.deps.length);
  for (let i = 0; i < N; i++) if (S.counts[i]) { own++; if (C.r[i] === 4) leg++; depOwn[depOf[i]]++; }
  let full = 0; C.deps.forEach((d, j) => { if (depOwn[j] === d.k) full++; });
  return { own, leg, full };
}
function installHTML() {
  if (STANDALONE()) return '<p class="small">L’appli est installée sur cet appareil.</p>';
  if (deferredInstall) return '<p class="small">Ajoute Cartes HBLM à ton écran d’accueil : elle s’ouvrira en plein écran, comme un jeu.</p><button class="btn accent wide" data-act="install">Installer l’appli</button>';
  if (IS_IOS) return '<p class="small">Sur iPhone, ouvre cette page dans <b>Safari</b>, touche le bouton <b>Partager</b> (le carré avec une flèche) puis <b>Sur l’écran d’accueil</b>.</p>';
  return '<p class="small">Sur Android, ouvre le menu <b>⋮</b> de Chrome puis <b>Installer l’application</b> (ou <b>Ajouter à l’écran d’accueil</b>).</p>';
}
function viewProfil() {
  const s = bigStats(); let th = 'system'; try { th = localStorage.getItem('cc-theme') || 'system'; } catch (e) {}
  return `<div class="view">
    <div class="head"><div><h2>${esc(S.pseudo)}</h2><p class="small muted">${fmt(S.opened)} boosters ouverts</p></div></div>
    <div class="statgrid">
      <div><b>${fmt(s.own)}</b><span>cartes sur ${fmt(N)} (${(s.own / N * 100).toFixed(1).replace('.', ',')} %)</span></div>
      <div><b>${s.leg}</b><span>légendaires sur ${C.r.filter(r => r === 4).length}</span></div>
      <div><b>${s.full}</b><span>équipes complètes sur ${C.deps.length}</span></div>
      <div><b>${fmt(S.trades)}</b><span>échanges conclus</span></div>
    </div>
    <div class="panel"><h3>Installer sur le téléphone</h3>${installHTML()}</div>
    <div class="panel"><h3>Thème</h3><div class="seg">${[['system', 'Comme l’appareil'], ['light', 'Clair'], ['dark', 'Sombre']].map(([v, l]) => `<button data-act="theme" data-v="${v}" aria-pressed="${th === v}">${l}</button>`).join('')}</div></div>
    <div class="panel"><h3>Règles</h3>
      <p class="small">Un booster gratuit toutes les 10 minutes (10 en réserve au plus), 5 cartes par booster, les cartes rares sortent moins souvent. Les doublons se recyclent en pièces ; une légendaire en double donne un fragment. Avec les pièces, achète un booster d’équipe ou fabrique la carte qui te manque. Échange tes doublons avec les autres licenciés.</p></div>
    <div class="panel"><h3>D’où viennent les cartes ?</h3>
      <p class="small">Licenciés du club, saison ${SEASON}. Seules les personnes qui ont accepté le droit à l’image apparaissent, avec leur nom, leur équipe et leur latéralité. Les stats et la rareté sont attribuées par le jeu (fidélité au club, rôle et hasard) : elles ne mesurent pas le niveau réel. Les cartes ne sont visibles que par les membres inscrits avec le code du club.</p></div>
    <button class="btn ghost wide" data-act="logout">Se déconnecter</button>
  </div>`;
}
function applyTheme(v) { try { localStorage.setItem('cc-theme', v); } catch (e) {} if (v === 'system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', v); }

// ------------------------------------------------------------------ CONNEXION / INSCRIPTION
const AUTH_ERR = { su_bad_code: 'Code du club incorrect. Demande-le à ton entraîneur.', su_pseudo_taken: 'Ce pseudo est déjà pris, choisis-en un autre.', su_bad_pseudo: 'Pseudo de 3 à 20 caractères : lettres, chiffres, espaces ou tirets.', su_bad_password: 'Mot de passe de 6 caractères minimum.', bad_login: 'Pseudo ou mot de passe incorrect.', not_member: 'Ce compte n’est pas inscrit au jeu.' };
function viewAuth(msg) {
  const su = state.authMode === 'signup';
  return `<div class="auth">
    <div class="authhead">${backHTML(2, '120px')}<h1>Cartes HBLM</h1><p class="muted">Collectionne les licenciés du Handball Lunel Marsillargues.</p></div>
    <div class="tabsub" role="tablist"><button role="tab" data-act="authmode" data-v="login" aria-selected="${!su}">Se connecter</button><button role="tab" data-act="authmode" data-v="signup" aria-selected="${su}">Créer un compte</button></div>
    <form id="authform" class="panel" novalidate>
      <div class="field"><label class="small" for="apseudo">Pseudo</label><input type="text" id="apseudo" name="pseudo" autocomplete="username" autocapitalize="off" spellcheck="false" maxlength="20" required></div>
      <div class="field"><label class="small" for="apw">Mot de passe</label><input type="password" id="apw" name="password" autocomplete="${su ? 'new-password' : 'current-password'}" minlength="6" required></div>
      ${su ? '<div class="field"><label class="small" for="acode">Code du club</label><input type="text" id="acode" name="code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Donné par ton entraîneur" required></div>' : ''}
      <p class="autherr" id="autherr" role="alert">${esc(msg || '')}</p>
      <button class="btn accent wide" type="submit">${su ? 'Créer mon compte' : 'Se connecter'}</button>
    </form>
    <p class="small muted center">${su ? 'Aucune adresse mail n’est demandée : retiens bien ton pseudo et ton mot de passe. Ton pseudo est visible des autres joueurs dans les échanges.' : 'Mot de passe oublié ? Demande à un responsable du club de le réinitialiser.'}</p>
  </div>`;
}
function showAuth(msg) {
  S = null; $('.app').hidden = true; $('#overlay').hidden = true;
  const a = $('#auth'); a.hidden = false; a.innerHTML = viewAuth(msg);
}
async function doAuth(f) {
  const pseudo = f.pseudo.value.trim().replace(/\s+/g, ' '), pw = f.password.value; const err = $('#autherr'); const btn = f.querySelector('button[type=submit]');
  err.textContent = '';
  if (slugOf(pseudo).length < 3) { err.textContent = state.authMode === 'signup' ? AUTH_ERR.su_bad_pseudo : AUTH_ERR.bad_login; return; }
  if (pw.length < 6) { err.textContent = state.authMode === 'signup' ? AUTH_ERR.su_bad_password : AUTH_ERR.bad_login; return; }
  btn.disabled = true; btn.textContent = 'Un instant…';
  try {
    if (state.authMode === 'signup') {
      const r = await fetch(SB_URL + '/functions/v1/signup', { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: SB_KEY }, body: JSON.stringify({ pseudo, password: pw, code: f.code.value }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error('su_' + (j.error || 'server'));
    }
    const { error } = await sb.auth.signInWithPassword({ email: slugOf(pseudo) + '@' + EMAIL_DOMAIN, password: pw });
    if (error) throw new Error(/invalid/i.test(error.message) ? 'bad_login' : error.message);
    await startGame(true);
  } catch (x) {
    const m = String(x && x.message || '');
    err.textContent = AUTH_ERR[m] || (/fetch|network|load failed/i.test(m) ? 'Pas de connexion. Réessaie quand tu as du réseau.' : 'Une erreur est survenue, réessaie.');
    btn.disabled = false; btn.textContent = state.authMode === 'signup' ? 'Créer mon compte' : 'Se connecter';
  }
}
async function startGame(fresh) {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { showAuth(); return; }
  uid = session.user.id;
  $('#auth').hidden = true; $('.app').hidden = false;
  $('#main').innerHTML = '<div class="loading">Chargement des licenciés…</div>';
  try {
    const st = await rpc('my_state');
    if (!C) await loadCards();
    await loadPhotoList();
    applyState(st);
  } catch (e) {
    if (String(e && e.message).includes('not_member')) { await sb.auth.signOut(); showAuth(AUTH_ERR.not_member); return; }
    $('#main').innerHTML = `<div class="view"><div class="loading">${esc(errMsg(e))}</div><button class="btn accent" data-act="retry" style="align-self:center">Réessayer</button></div>`; return;
  }
  loadFavs();
  if (fresh && !S.opened) toast(`Bienvenue ${S.pseudo} ! Tes 10 premiers boosters t’attendent.`);
  setTab(state.tab);
}
async function logout() { await sb.auth.signOut().catch(() => {}); C = null; N = 0; uid = null; state.offers = []; state.offersLoaded = false; state.offerDraft = null; state.dep = null; state.tab = 'booster'; state.authMode = 'login'; document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === 'booster'))); showAuth(); }

// ------------------------------------------------------------------ événements
document.addEventListener('submit', e => { if (e.target.id === 'authform') { e.preventDefault(); doAuth(e.target); } });
document.addEventListener('click', e => {
  const tabBtn = e.target.closest('nav.tabs button'); if (tabBtn) { if (S) setTab(tabBtn.dataset.tab); return; }
  const el = e.target.closest('[data-act]'); if (!el) { if (e.target.id === 'overlay' && !state.reveal) { $('#overlay').hidden = true; } return; }
  const a = el.dataset.act, i = el.dataset.i != null ? Number(el.dataset.i) : null;
  switch (a) {
    case 'authmode': state.authMode = el.dataset.v; $('#auth').innerHTML = viewAuth(); break;
    case 'retry': startGame(); break;
    case 'open': openBooster(false); break;
    case 'openreg': openBooster(true); break;
    case 'flip': {
      const R = state.reveal;
      if (!R.open) {
        R.open = true; el.classList.add('open'); el.setAttribute('aria-label', 'Carte suivante');
        const r = C.r[R.ids[R.k]];
        $('#revbadge').innerHTML = (R.fresh[R.k] ? '<span class="badge new pop">Nouvelle</span>' : '<span class="badge dup pop">Doublon</span>') + (r >= 2 ? ` <span class="badge pop r${r}" style="background:var(--rc);color:#FFFFFF">${RAR_MARK[r]}${RAR_NAMES[r]}</span>` : '');
      } else { R.k++; R.open = false; drawReveal(); }
      break;
    }
    case 'skip': state.reveal.k = state.reveal.ids.length; drawReveal(); break;
    case 'closeov': $('#overlay').hidden = true; { const wasReveal = !!state.reveal; state.reveal = null; render(); if (wasReveal) refreshState(true); } break;
    case 'see': showCard(i); break;
    case 'dep': state.dep = Number(el.dataset.j); state.f.s = 'all'; $('#main').scrollTop = 0; render(); animEnter(); break;
    case 'back': state.dep = null; state.f.s = 'own'; render(); animEnter(); break;
    case 'cmode': state.cmode = el.dataset.v; state.query = ''; render(); animEnter(); break;
    case 'page': state.page = Number(el.dataset.v); $('#main').scrollTop = 0; render(); break;
    case 'togglef': state.showF = !state.showF; render(); break;
    case 'fav': { e.stopPropagation(); if (FAV.has(i)) FAV.delete(i); else FAV.add(i); saveFavs(); const on = isFav(i); el.classList.toggle('on', on); el.style.setProperty('--fo', on ? 1 : 0); el.setAttribute('aria-label', on ? 'Retirer des favoris' : 'Ajouter aux favoris'); if (state.f.s === 'fav') { const st = $('#main').scrollTop; render(); $('#main').scrollTop = st; } break; }
    case 'setf': { const k = el.dataset.k, v = el.dataset.v; state.f[k] = (k === 'r' || k === 't') ? Number(v) : v; state.limit = 60; state.page = 0; const st = $('#main').scrollTop; render(); $('#main').scrollTop = st; break; }
    case 'resetf': state.f = { r: -1, t: -1, s: 'all', sort: 'nom' }; state.limit = 60; render(); break;
    case 'recycle': recycleAll(); break;
    case 'recycle1': recycle1(i); break;
    case 'craft': craft(i); break;
    case 'gotab': setTab(el.dataset.t); break;
    case 'nohint': try { localStorage.setItem('cartes-hblm-nohint', '1'); } catch (x) {} render(); break;
    // échanges
    case 'ttab': state.tradeTab = el.dataset.v; render(); break;
    case 'reloffers': state.offersLoaded = false; render(); loadOffers(true); refreshState(true); break;
    case 'newoffer': state.offerDraft = { q: '', want: null, give: null }; render(); break;
    case 'givethis': $('#overlay').hidden = true; state.offerDraft = { q: '', want: null, give: i }; state.tradeTab = 'offres'; setTab('echanges'); break;
    case 'wantthis': $('#overlay').hidden = true; state.offerDraft = { q: '', want: i, give: null }; state.tradeTab = 'offres'; setTab('echanges'); break;
    case 'canceldraft': state.offerDraft = null; render(); break;
    case 'pickwant': { const g = $('#ogive'); if (g) state.offerDraft.give = Number(g.value); state.offerDraft.want = i; render(); break; }
    case 'clearwant': { const g = $('#ogive'); if (g) state.offerDraft.give = Number(g.value); state.offerDraft.want = null; state.offerDraft.q = ''; render(); break; }
    case 'postoffer': postOffer(); break;
    case 'withdraw': withdraw(Number(el.dataset.id)); break;
    case 'accept': acceptOffer(Number(el.dataset.id)); break;
    // profil
    case 'theme': applyTheme(el.dataset.v); render(); break;
    case 'install': if (deferredInstall) { deferredInstall.prompt(); deferredInstall.userChoice.finally(() => { deferredInstall = null; render(); }); } break;
    case 'logout': logout(); break;
    case 'delphoto': deletePhoto(i); break;
  }
});
document.addEventListener('input', e => {
  const restore = id => { const pos = e.target.selectionStart; render(); const q = $('#' + id); if (q) { q.focus(); q.setSelectionRange(pos, pos); } };
  if (e.target.id === 'q') { state.query = e.target.value; state.page = 0; restore('q'); }
  if (e.target.id === 'owant' && state.offerDraft) { state.offerDraft.q = e.target.value; const g = $('#ogive'); if (g) state.offerDraft.give = Number(g.value); restore('owant'); }
});
document.addEventListener('toggle', e => { if (e.target.id === 'regbox') state.regOpen = e.target.open; }, true);
document.addEventListener('change', e => {
  if (e.target.matches && e.target.matches('input[data-photo]') && e.target.files[0]) { uploadPhoto(+e.target.dataset.photo, e.target.files[0]); return; }
  if (e.target.id === 'regdep') { const j = state.regDep = Number(e.target.value); const b = $('#regbtn'); if (b) { b.textContent = `Acheter · ${regPrice(j)} pièces`; b.disabled = S.coins < regPrice(j); } const m = $('#regmix'); if (m) m.textContent = regMix(j); }
  if (e.target.id === 'ogive' && state.offerDraft) state.offerDraft.give = Number(e.target.value);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#overlay').hidden && !state.reveal) $('#overlay').hidden = true; });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S) { refreshState(true); if (state.tab === 'echanges') loadOffers(true); } });
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; if (S && state.tab === 'profil' && $('#overlay').hidden) render(); });
let ticks = 0;
setInterval(() => {
  if (!S) return; ticks++;
  const before = S.stock; tickStock();
  if (S.stock !== before) { setWallet(); if (state.tab === 'booster' && $('#overlay').hidden && !state.busy && !typing()) render(); }
  const cd = $('#countdown'); if (cd) cd.textContent = S.stock >= STOCK_MAX ? 'Réserve pleine' : 'Prochain dans ' + mmss(nextIn());
  if (document.visibilityState !== 'visible') return;
  if (ticks % 60 === 0) refreshState(true);
  if (state.tab === 'echanges' && ticks % 20 === 0) loadOffers(true);
}, 1000);

// ------------------------------------------------------------------ démarrage
try { const th = localStorage.getItem('cc-theme'); if (th && th !== 'system') document.documentElement.setAttribute('data-theme', th); } catch (e) {}
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT' && S) showAuth('Ta session a expiré, reconnecte-toi.'); });
startGame();
})();

</script>
</body>
</html>
